<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>404 · 페이지를 찾을 수 없습니다 | JSU LabTools</title>
  <style>
    :root{color-scheme:light;--ink:#23364d;--muted:#59697b;--line:#e1e6ec;--accent:#344e6b}
    *{box-sizing:border-box}body{margin:0;background:#f7f9fb;color:var(--ink);font:16px/1.7 "Segoe UI","Malgun Gothic",sans-serif}
    header,main,footer{width:min(100% - 48px,760px);margin-inline:auto}header{padding-top:36px;font-size:22px;letter-spacing:-.5px}header strong{font-weight:650}
    main{margin-top:76px;padding:40px;background:#fff;border:1px solid var(--line);border-radius:14px}.code{margin:0 0 12px;color:var(--muted);font-size:14px;font-weight:600;letter-spacing:2px}
    h1{margin:0 0 18px;font-size:clamp(24px,5vw,32px);line-height:1.4;letter-spacing:-1px;overflow-wrap:anywhere}p{margin:0;color:var(--muted)}p+p{margin-top:10px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:28px;padding:10px 18px;border:1px solid #c9d5e1;border-radius:7px;background:#eef3f8;color:var(--accent);font-weight:600;text-decoration:none}
    a:hover{background:#dfe9f2}a:focus-visible{outline:3px solid #397aaf;outline-offset:4px}footer{margin-top:22px;padding-bottom:30px;font-size:12px;color:var(--muted)}
    @media(max-width:480px){header,main,footer{width:calc(100% - 32px)}header{padding-top:24px}main{margin-top:44px;padding:26px 22px}a{width:100%}}
  </style>
</head>
<body>
  <header>JSU <strong>LabTools</strong></header>
  <main>
    <p class="code">404 · NOT FOUND</p>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>입력한 주소가 잘못되었거나, 요청한 페이지 또는 파일이 없습니다.</p>
    <p>주소를 다시 확인하거나 도구 목록에서 필요한 도구를 열어 주세요.</p>
    <a href="https://jsu-labtools.pages.dev/">도구 목록으로 돌아가기</a>
  </main>
  <footer>JSU LabTools · 오류 안내 v1.0.0</footer>
</body>
</html>
